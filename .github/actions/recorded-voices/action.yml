name: Recorded voices
description: Records every German text the game reads aloud with Piper into audio/ (kept in the CI cache between runs). Needs npm ci first.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          audio
          .piper-voices
        key: recorded-voices-${{ hashFiles('index.html', 'scripts/build-audio.py') }}
        restore-keys: recorded-voices-
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Record
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
        pip install --quiet piper-tts==1.8.0
        npx playwright install --with-deps chromium > /dev/null
        node scripts/list-spoken.js "$RUNNER_TEMP/audio-texts.json"
        python scripts/build-audio.py "$RUNNER_TEMP/audio-texts.json"
        du -sh audio
