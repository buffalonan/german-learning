name: Web

# Publishes the game to GitHub Pages (https://buffalonan.github.io/german-learning/) on each merge to main.
on:
  push:
    branches: [main]
    paths: ["index.html", "pictures.js", "art.js", "art/**", "logo/**", "manifest.webmanifest", "scripts/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/recorded-voices
      - name: Collect the game's files
        run: node scripts/build-app-web.js _site --web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v4
