name: Claude review

# An independent Claude reviewer: it reviews every pull request with a fresh context,
# and answers when a repo owner or collaborator writes @claude in a PR comment.
# Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN (create it with `claude setup-token`).
# Until the secret exists, the jobs skip instead of failing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the pull request
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip when the token isn't set up
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to turn on Claude reviews."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an independent reviewer for this pull request. Read REVIEW.md in the
            repo root first and follow it. Review only the changes in this PR
            (`gh pr diff ${{ github.event.pull_request.number }}`), reading surrounding code as needed.

            Post each concrete problem as an inline comment on the line it concerns, using
            mcp__github_inline_comment__create_inline_comment. Start each with its severity:
            "Blocking:" for bugs, security issues or wrong German, "Suggestion:" for anything optional.
            Then post one short summary comment with `gh pr comment`, saying either what must be
            fixed before merging or that it looks good to merge. Don't praise or restate the diff.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    name: Answer @claude
    if: >
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip when the token isn't set up
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to turn on @claude."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
