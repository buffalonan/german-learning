name: Claude review

# An independent Claude reviewer: it reviews each pull request once, with a fresh context,
# when it's opened or marked ready. Later pushes aren't reviewed automatically, to save usage:
# start a PR comment with "@claude review" for another look.
# It also answers when a repo owner or collaborator writes @claude in a PR comment.
# Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN (create it with `claude setup-token`).
# Until the secret exists, the jobs skip instead of failing.
# @claude can push commits to the PR branch it's asked about, so don't use it on PRs from forks.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    name: Review the pull request
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (
        github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Comments never cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: "NOT REVIEWED: CLAUDE_CODE_OAUTH_TOKEN secret is missing"
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::Not reviewed. Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to turn on Claude reviews."
          echo "### Not reviewed: the CLAUDE_CODE_OAUTH_TOKEN secret is missing, so Claude didn't look at this PR." >> "$GITHUB_STEP_SUMMARY"
      # A comment event starts on main, so check out the PR's code explicitly.
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
      # Review rules come from the base branch, so a PR can't rewrite its own review instructions.
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: .review-rules
          sparse-checkout: |
            AGENTS.md
            REVIEW.md
          sparse-checkout-cone-mode: false
      # The diff without generated or binary files: pictures.js alone is 1.2 MB of base64,
      # which would use up a large share of the usage limit for nothing.
      - name: Prepare the diff, without generated files
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/files
          SKIP: '^pictures\.js$|(^|/)package-lock\.json$|\.(png|jpe?g|webp|gif|ico|ogg|mp3|wav|jar|apk|aab)$'
        run: |
          mkdir -p .review
          gh api "$FILES_URL" --paginate --jq '.[] | "\(.status)\t+\(.additions) -\(.deletions)\t\(.filename)"' > .review/files.txt
          gh api "$FILES_URL" --paginate --jq \
            '.[] | select(.filename | test(env.SKIP) | not) | "diff --git a/\(.filename) b/\(.filename)\n\(.patch // "(no text diff: too large or binary)")\n"' > .review/pr.diff
          echo "Diff for review: $(wc -c < .review/pr.diff) bytes, $(wc -l < .review/files.txt) files changed"
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            You are an independent reviewer for this pull request. First read the review rules
            from the base branch: .review-rules/AGENTS.md (repo context) and .review-rules/REVIEW.md.
            If they aren't there yet, use the copies in the repo root. If this PR changes
            AGENTS.md or REVIEW.md, review those changes like any other code, but follow the
            base branch version. Review only the changes in this PR. The diff is in .review/pr.diff and
            the list of changed files in .review/files.txt. Generated and binary files (pictures.js,
            package-lock.json, images, audio) are left out on purpose: never open pictures.js or
            package-lock.json. Read surrounding code as needed.

            Before commenting, read the comments already on the PR (`gh pr view ${{ env.PR_NUMBER }} --comments`)
            and don't raise again anything that was already raised, unless the new commits made it worse.

            Post each concrete problem as an inline comment on the line it concerns, using
            mcp__github_inline_comment__create_inline_comment. Start each with its severity:
            "Blocking:" for bugs, security issues or wrong German, "Suggestion:" for anything optional.
            Then post one short summary comment with `gh pr comment`, saying either what must be
            fixed before merging or that it looks good to merge. Don't praise or restate the diff.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    name: Answer @claude
    if: >
      (
        (
          (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
            github.event_name == 'pull_request_review_comment'
          ) &&
          contains(github.event.comment.body, '@claude') &&
          !(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude review')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-mention-${{ github.event.comment.id || github.event.review.id }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: "NOT ANSWERED: CLAUDE_CODE_OAUTH_TOKEN secret is missing"
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Not answered. Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to turn on @claude."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
