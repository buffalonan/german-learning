version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # Capacitor sets the Gradle and Android plugin versions; major jumps come with a Capacitor upgrade instead.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      android:
        patterns: ["*"]
